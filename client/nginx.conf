# Static hosting for the built React SPA (client/dist).
# Served behind the host reverse proxy, which forwards everything that is not
# /api/* to this container on port 80.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite writes content-hashed file names into /assets, so they can be cached
    # for as long as we like: a new deploy always produces new URLs.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html references those hashed files, so it must never be cached or a
    # deploy would keep serving the previous asset references.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routes (react-router) have no file on disk: fall back to the
    # app shell so a refresh or deep link still boots the SPA.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;
}
